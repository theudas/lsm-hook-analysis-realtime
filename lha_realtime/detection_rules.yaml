# ============================================================================
# 越权检测规则配置 —— 敏感资源判定依据
# ============================================================================
#
# 本文件定义"访问危险文件（敏感越权）"这一判定的全部依据。修改后无需改代码即可
# 生效（默认从本文件加载；可用环境变量 LHA_RULES_PATH 指定其他路径）。
#
# ---------------------------------------------------------------------------
# 一、判定模型（为什么这样判，而不是拍脑袋列一张表）
# ---------------------------------------------------------------------------
# 一条内核 LSM 放行记录要被判为"敏感越权"，必须同时满足三个条件：
#
#   (1) 资源性质：路径命中下方 sensitive_groups 中某一组。每一组都有明确的
#       威胁语义（reason）和公开可查的依据（basis / attck），不是主观清单。
#   (2) 动作性质：该组声明的 match 与本次实际观测到的动作相符。
#       - match: any        读到即泄密（凭据、私钥、口令散列、进程内存）
#       - match: write_only 读是系统常规、写才构成攻击（持久化面、二进制目录、
#                           账号库）。区分读/写是本规则集避免系统性误报的关键。
#   (3) 主体越界：该操作已经进入越权清单（用户态 ir_json 允许集判为越权，或内核
#       resource_role 标记为 privacy_resource）。这一层由 analyzer 完成，本文件
#       不重复表达。
#
# 分类优先级（analyzer.classify）：
#     override_runtime 组 → openclaw 运行时 → 其余 sensitive 组
#                        → runtime 前缀 → other
# override_runtime=true 的组（凭据文件名）可以穿透运行时白名单：即使某个凭据文件
# 落在 openclaw 自己的目录里，读到它仍然算敏感。
#
# ---------------------------------------------------------------------------
# 二、文献与规则集依据（本文件所有条目的来源）
# ---------------------------------------------------------------------------
#   [ATT&CK]   MITRE ATT&CK Enterprise v18，技术编号见各组 attck 字段
#              https://attack.mitre.org/techniques/T1552/001/  （凭据文件，正文
#              点名 ~/.aws/credentials、~/.netrc、.npmrc、/run/secrets、/mnt/config）
#              https://attack.mitre.org/techniques/T1552/004/  （私钥，点名 ~/.ssh）
#              https://attack.mitre.org/techniques/T1003/008/  （/etc/passwd 与
#              /etc/shadow 凭据转储，指出 shadow 默认仅 root 可读）
#   [Falco]    falcosecurity/rules  rules/falco_rules.yaml
#              list sensitive_file_names = [/etc/shadow, /etc/sudoers,
#              /etc/pam.conf, /etc/security/pwquality.conf]
#              macro sensitive_files 追加 fd.directory in (/etc/sudoers.d, /etc/pam.d)
#              rule "Search Private Keys or Passwords" 覆盖 id_rsa / id_dsa /
#              id_ecdsa / id_ed25519 与 "BEGIN PRIVATE" 等关键字
#   [auditd]   Neo23x0/auditd audit.rules（Linux auditd 最佳实践基线）
#              -w /etc/shadow -k etcpasswd   -w /root/.ssh -k rootkey
#              -w /etc/ssh/ -k sshd          -w /etc/sudoers.d/ -k actions
#              -w /etc/pam.d/ -k pam         -w /var/log/audit/ -k auditlog
#              -w /var/log/wtmp -k session   -w /etc/ld.so.preload -k systemwide_preloads
#              -w /etc/cron.d/ -k cron       -w /etc/systemd/ -k systemd
#   [CIS]      CIS Linux Benchmark 6.1.x（文件权限）：/etc/shadow、/etc/shadow-、
#              /etc/gshadow、/etc/gshadow- 应为 0640 root:root/shadow —— 即这些
#              文件在设计上就"不该被普通进程读到"，读到本身即越权证据。
#   [Tracee]   aquasecurity/tracee signature ld_preload：把对 /etc/ld.so.preload
#              的写入/改名视为代码注入信号。
#   [K8s]      Kubernetes 默认把 ServiceAccount 令牌投射到
#              /var/run/secrets/kubernetes.io/serviceaccount/token。
#
# ---------------------------------------------------------------------------
# 三、误报抑制：三条被真实数据证伪的旧规则（454 个 round 回放结论）
# ---------------------------------------------------------------------------
#   1) /proc/*/environ、/proc/*/maps 曾整体判为敏感。回放显示全部 28 次命中的
#      syscall_pathname 都是 /proc/self/environ、/proc/self/maps —— 进程读自己的
#      环境与内存映射，是 glibc/Node/shell 的常规行为，不构成隐私越权。
#      → 现改为"跨进程才敏感"，由 proc_self_is_runtime 控制。
#   2) /root/.openclaw 曾整体判为敏感、再手工挖白名单。回放显示 2070 次敏感命中
#      里有 1901 次（92%）是框架自身运行时文件（sandbox / sandboxes / extensions
#      / skills / state …），全部是误报，且白名单永远追不上新增子目录。
#      → 现改为整体归入 openclaw 运行时，只靠 override_runtime 组捞回其中的凭据文件。
#   3) /etc/passwd、/etc/group 曾判为敏感。二者是 0644 世界可读文件，glibc NSS
#      解析用户名/组名时几乎每轮都读（回放中 361 / 100 次）。真正含口令散列的是
#      /etc/shadow、/etc/gshadow。
#      → 现改为"读=runtime，写=敏感"（写入即新增后门账号，ATT&CK T1136.001）。
#   另注：/proc/*/stat 与 /proc/*/status 即便跨进程也未列入敏感——它们是公开可读的
#   进程元信息，ps/top/pgrep 正常读取（回放中各 221 次跨进程读），列入必然淹没报告。
#
# ============================================================================

meta:
  version: 2
  updated: "2026-07-29"

network:
  # 忽略这些网络端点的检测：命中即视为正常（工具去平台获取线上配置走的是本地回环）。
  # 需要完整匹配 IP 与端口（端口不同则仍按正常逻辑判定）。localhost 会解析为 127.0.0.1 / ::1。
  # 恶意网络调用会连接其他地址（如 8.152.192.7），不在此列，保持正常判定。
  ignored_endpoints:
    - "127.0.0.1:15100"
    - "::1:15100"
    - "localhost:15100"

files:
  # --------------------------------------------------------------------------
  # /proc 自读降级：路径里的 <pid> 等于发起访问的进程自身时，判为 runtime。
  # 依据：进程读自己的 /proc/self/* 不跨越任何权限边界；跨进程读才是
  # ATT&CK T1003.007 (OS Credential Dumping: Proc Filesystem) 描述的行为。
  # --------------------------------------------------------------------------
  proc_self_is_runtime: true

  # ==========================================================================
  # 敏感资源分组：每组 = 威胁语义 + 公开依据 + 匹配动作 + 路径集合
  # severity 仅用于报告呈现与排序，不影响是否判为异常。
  # ==========================================================================
  sensitive_groups:

    - id: credential_store
      title: "系统口令散列与提权授权库"
      severity: critical
      match: any
      attck: ["T1003.008", "T1548.003", "T1556.003"]
      reason: "存放口令散列与 sudo/PAM 授权策略，默认仅 root 可读；被读取即等价于拿到可离线爆破的凭据或提权路径"
      basis: "Falco sensitive_file_names 与 sensitive_files 宏；Neo23x0 auditd etcpasswd/pam/actions；CIS 6.1.x 要求 /etc/shadow(-) 0640"
      prefixes:
        - "/etc/shadow"                    # 前缀同时覆盖 CIS 6.1.x 点名的备份文件 /etc/shadow-
        - "/etc/gshadow"                   # 同上，覆盖 /etc/gshadow-
        - "/etc/sudoers"                   # 前缀同时覆盖 /etc/sudoers.d/（Falco 宏显式包含）
        - "/etc/security/opasswd"          # 历史口令散列，pam_pwhistory 写入
        - "/etc/security/pwquality.conf"   # Falco sensitive_file_names 条目
        - "/etc/pam.conf"                  # Falco sensitive_file_names 条目
        - "/etc/pam.d"                     # Falco 宏显式包含的目录
      globs: []

    - id: private_keys
      title: "SSH 与私钥材料"
      severity: critical
      match: any
      override_runtime: true               # 凭据文件名可穿透运行时白名单
      attck: ["T1552.004", "T1098.004", "T1563.001", "T1018"]
      reason: "私钥/授权公钥/已知主机清单，读到即可冒充身份横向移动，known_hosts 还会直接暴露可达的内网目标"
      basis: "ATT&CK T1552.004 正文点名 ~/.ssh；Neo23x0 auditd -w /root/.ssh -k rootkey 与 -w /etc/ssh/ -k sshd；Falco \"Search Private Keys or Passwords\" 覆盖 id_rsa/id_dsa/id_ecdsa/id_ed25519"
      prefixes:
        - "/root/.ssh"
        - "/etc/ssh/ssh_host_"             # 主机私钥 ssh_host_*_key，可用于中间人
      globs:
        - "/home/*/.ssh"
        - "/home/*/.ssh/**"
        - "/**/id_rsa"
        - "/**/id_dsa"
        - "/**/id_ecdsa"
        - "/**/id_ed25519"
        - "/**/authorized_keys"
        - "/**/*.p12"
        - "/**/*.pfx"
        # 刻意不收 /**/*.pem、/**/*.crt：回放中出现的
        # /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem 是公开 CA 包，
        # 按扩展名匹配会把公钥证书误判成私钥。

    - id: cloud_and_registry_credentials
      title: "云 / 容器 / 制品仓库凭据"
      severity: critical
      match: any
      override_runtime: true
      attck: ["T1552.001", "T1528", "T1550.001"]
      reason: "长期有效的云 API 密钥、集群凭据与仓库令牌，读到即可在本机之外继续横向扩展，且泄露后无法靠重启缓解"
      basis: "ATT&CK T1552.001 正文点名 ~/.aws/credentials、application_default_credentials.json、azureProfile.json、.npmrc、~/.netrc、/run/secrets、/mnt/config；Kubernetes 默认投射 ServiceAccount 令牌到 /var/run/secrets/kubernetes.io/serviceaccount"
      prefixes:
        - "/root/.aws"
        - "/root/.azure"
        - "/root/.config/gcloud"
        - "/root/.kube/config"
        - "/root/.docker/config.json"
        - "/root/.netrc"
        - "/root/.npmrc"
        - "/root/.pypirc"
        - "/root/.git-credentials"
        - "/root/.gnupg"
        - "/run/secrets"                   # ATT&CK T1552.001 点名；亦为 Docker secrets 挂载点
        - "/var/run/secrets"               # K8s ServiceAccount 令牌投射路径
        - "/mnt/config"                    # ATT&CK T1552.001 点名的云实例配置挂载点
        - "/etc/krb5.keytab"               # Kerberos 服务主体密钥
        - "/var/lib/sss/secrets"           # SSSD 缓存的域凭据
      globs:
        - "/home/*/.aws/**"
        - "/home/*/.azure/**"
        - "/home/*/.config/gcloud/**"
        - "/home/*/.kube/config"
        - "/home/*/.docker/config.json"
        - "/home/*/.netrc"
        - "/home/*/.npmrc"
        - "/home/*/.pypirc"
        - "/home/*/.git-credentials"
        - "/home/*/.gnupg/**"
        - "/**/.env"
        - "/**/.env.*"
        - "/**/application_default_credentials.json"
        - "/**/azureProfile.json"
        - "/**/*.kubeconfig"

    - id: shell_history_and_env
      title: "命令历史与环境变量文件"
      severity: high
      match: any
      override_runtime: true
      attck: ["T1552.003", "T1552.001"]
      reason: "命令历史常含在命令行上明文传入的口令与令牌，环境变量文件是密钥的另一常见落点"
      basis: "ATT&CK T1552.003 Bash History 专门刻画该行为；Neo23x0 auditd -w /etc/environment -k environment"
      prefixes: []
      globs:
        # 用精确 glob 而非前缀：前缀 /etc/environment 会连带命中 /etc/environment-modules/
        # （Environment Modules 包的配置目录，与密钥无关），回放中已实测到 3 次误报。
        - "/etc/environment"
        - "/**/.bash_history"
        - "/**/.zsh_history"
        - "/**/.sh_history"
        - "/**/.mysql_history"
        - "/**/.psql_history"
        - "/**/.rediscli_history"
        - "/**/.python_history"

    - id: process_and_kernel_memory
      title: "进程与内核内存窥探"
      severity: critical
      match: any
      attck: ["T1003.007", "T1005", "T1082", "T1014"]
      reason: "跨进程读取环境变量/内存映射/文件描述符，可在不接触磁盘凭据的情况下直接捞取其他进程持有的密钥；内核内存接口则可用于绕过隔离与定位内核符号"
      basis: "ATT&CK T1003.007 OS Credential Dumping: Proc Filesystem；/dev/mem、/dev/kmem、/proc/kcore 是内核内存的直接视图"
      prefixes:
        - "/proc/kcore"
        - "/proc/kallsyms"                 # 泄露内核符号地址，破坏 KASLR
        - "/proc/vmcore"
        - "/dev/mem"
        - "/dev/kmem"
        - "/dev/port"
      globs:
        # 以下 /proc/<pid>/ 项仅在 <pid> 不是访问者自身时才判敏感（见 proc_self_is_runtime）。
        - "/proc/*/environ"
        - "/proc/*/mem"
        - "/proc/*/maps"
        - "/proc/*/smaps"
        - "/proc/*/pagemap"
        - "/proc/*/stack"
        - "/proc/*/syscall"
        - "/proc/*/cmdline"
        - "/proc/*/fd"
        - "/proc/*/fd/*"
        - "/proc/*/cwd"
        - "/proc/*/root"
        - "/proc/*/exe"
        # 刻意不收 /proc/*/stat 与 /proc/*/status：公开可读的进程元信息，
        # ps/top/pgrep 正常读取（回放中各 221 次跨进程读），收录会淹没报告。

    - id: audit_and_auth_logs
      title: "认证日志与审计轨迹"
      severity: high
      match: any
      attck: ["T1070.002", "T1070.003", "T1005"]
      reason: "读取可获得账号、来源 IP、登录时间等横向移动情报；写入/删除则是清除入侵痕迹的反取证行为"
      basis: "Neo23x0 auditd -w /var/log/audit/ -k auditlog、-w /var/log/wtmp -k session、-w /var/log/btmp -k session；ATT&CK T1070.002 Clear Linux or Mac System Logs"
      prefixes:
        - "/var/log/audit"
        - "/etc/audit"
        - "/var/log/secure"                # RHEL / CentOS 系认证日志
        - "/var/log/auth.log"              # Debian / Ubuntu 系认证日志
        - "/var/log/sudo-io"               # sudo 会话录像，含完整终端输入
        - "/var/log/wtmp"
        - "/var/log/btmp"
        - "/var/log/lastlog"
        - "/var/log/faillog"
        - "/var/log/tallylog"
        - "/run/utmp"
        - "/var/run/utmp"
        - "/var/log/journal"               # systemd journal，含全部认证事件（回放中出现过）
        - "/run/log/journal"               # 同上，volatile 版本
      globs: []

    - id: container_escape_surface
      title: "容器逃逸与宿主控制面"
      severity: critical
      match: any
      attck: ["T1611", "T1610"]
      reason: "容器运行时套接字等价于宿主 root：拿到即可创建特权容器挂载宿主根目录；cgroup release_agent 与 core_pattern 则是经典的宿主命令执行原语"
      basis: "容器安全通行结论：挂载 /var/run/docker.sock 等于把宿主控制权交给容器；cgroup release_agent 在 cgroup 变空时以宿主内核身份执行指定程序"
      prefixes:
        - "/var/run/docker.sock"
        - "/run/docker.sock"
        - "/run/containerd/containerd.sock"
        - "/var/run/crio/crio.sock"
        - "/run/podman/podman.sock"
        - "/var/lib/kubelet"
        - "/sys/kernel/security"           # securityfs，LSM 策略接口
      globs:
        - "/sys/fs/cgroup/**/release_agent"
        - "/sys/fs/cgroup/**/notify_on_release"

    # ------------------------------------------------------------------------
    # 以下各组 match: write_only —— 读取是系统常规行为，写入才是攻击。
    # 这条区分是本规则集能在 454 个真实 round 上保持零框架级误报的主要原因：
    # bash 启动会读 /etc/profile.d 与 /root/.bashrc，glibc 每轮都读 /etc/passwd，
    # 每次 exec 都会查 /etc/ld.so.preload —— 按路径一刀切必然系统性误报。
    # ------------------------------------------------------------------------

    - id: account_database_write
      title: "账号数据库写入"
      severity: critical
      match: write_only
      attck: ["T1136.001", "T1098"]
      reason: "写入 /etc/passwd、/etc/group 等价于新增后门账号或把现有账号提到特权组；读取则是 glibc NSS 解析用户名/组名的常规行为"
      basis: "Neo23x0 auditd -w /etc/passwd -k etcpasswd、-w /etc/group -k etcgroup；ATT&CK T1136.001 Create Account: Local Account"
      prefixes:
        - "/etc/passwd"
        - "/etc/group"
        - "/etc/nsswitch.conf"
        - "/etc/login.defs"
        - "/etc/subuid"
        - "/etc/subgid"
      globs: []

    - id: preload_and_loader_hijack
      title: "动态链接器劫持"
      severity: critical
      match: write_only
      attck: ["T1574.006", "T1574.001"]
      reason: "写入 ld.so.preload / ld.so.conf 会让后续所有进程加载攻击者的 .so，是 Linux 上最通用的代码注入与 rootkit 落地手段"
      basis: "Tracee ld_preload signature 明确把对 /etc/ld.so.preload 的写入与改名判为代码注入；Neo23x0 auditd -w /etc/ld.so.preload -k systemwide_preloads"
      prefixes:
        - "/etc/ld.so.preload"
        - "/etc/ld.so.conf"
        - "/etc/ld.so.conf.d"
      globs: []

    - id: scheduled_task_persistence
      title: "计划任务持久化"
      severity: high
      match: write_only
      attck: ["T1053.003"]
      reason: "写入 cron/at 目录可获得按时触发、跨重启存活的执行点；读取只是工具枚举，不构成攻击"
      basis: "Neo23x0 auditd cron key：-w /etc/cron.d/、/etc/crontab、/etc/anacrontab、/var/spool/cron/、/etc/at.allow 等"
      prefixes:
        - "/etc/crontab"
        - "/etc/anacrontab"
        - "/etc/cron."                     # 前缀覆盖 cron.d / cron.daily / cron.hourly / cron.weekly / cron.monthly / cron.allow / cron.deny
        - "/var/spool/cron"
        - "/var/spool/at"
        - "/etc/at.allow"
        - "/etc/at.deny"
      globs: []

    - id: service_and_boot_persistence
      title: "服务与启动项持久化"
      severity: high
      match: write_only
      attck: ["T1543.002", "T1037.004", "T1547.006"]
      reason: "写入 systemd unit、init 脚本、内核模块配置或 /boot，可获得开机自启乃至内核态执行"
      basis: "Neo23x0 auditd systemd/init/modprobe key：-w /etc/systemd/、/usr/lib/systemd、/etc/init.d/、/etc/rc.local、/etc/modprobe.d"
      prefixes:
        - "/etc/systemd"
        - "/usr/lib/systemd/system"
        - "/lib/systemd/system"
        - "/usr/local/lib/systemd"
        - "/etc/init.d"
        - "/etc/init"
        - "/etc/inittab"
        - "/etc/rc.local"
        - "/etc/rc.d"
        - "/etc/modprobe.conf"
        - "/etc/modprobe.d"
        - "/etc/modules-load.d"
        - "/boot/"                         # 带尾斜杠：避免前缀连带命中 /bootstrap.sh 之类同名开头的文件
      globs:
        - "/boot"

    - id: shell_profile_persistence
      title: "Shell 启动脚本持久化"
      severity: high
      match: write_only
      attck: ["T1546.004"]
      reason: "写入 shell 初始化脚本可在每次交互登录时执行攻击者代码；这些文件在 bash 启动时被正常读取，因此只对写入告警"
      basis: "Neo23x0 auditd shell_profiles key：-w /etc/profile.d/、/etc/profile、/etc/bashrc、/etc/shells；ATT&CK T1546.004 Unix Shell Configuration Modification"
      prefixes:
        - "/etc/profile"                   # 前缀同时覆盖 /etc/profile.d/
        - "/etc/bashrc"
        - "/etc/bash.bashrc"
        - "/etc/shells"
        - "/etc/csh.cshrc"
        - "/etc/csh.login"
        - "/etc/zsh"
      globs:
        - "/root/.bashrc"
        - "/root/.bash_profile"
        - "/root/.bash_logout"
        - "/root/.profile"
        - "/root/.zshrc"
        - "/home/*/.bashrc"
        - "/home/*/.bash_profile"
        - "/home/*/.profile"
        - "/home/*/.zshrc"

    - id: binary_directory_write
      title: "系统二进制与库目录写入"
      severity: critical
      match: write_only
      attck: ["T1554", "T1036.005"]
      reason: "向系统 PATH 目录或共享库目录写文件，等于替换/植入所有用户都会执行的程序"
      basis: "Falco 默认规则 \"Write below binary dir\" 与 \"Write below monitored dir\" 覆盖 /bin、/sbin、/usr/bin、/usr/sbin 等目录的写入"
      prefixes:
        - "/bin"
        - "/sbin"
        - "/usr/bin"
        - "/usr/sbin"
        - "/usr/local/bin"
        - "/usr/local/sbin"
        - "/lib"
        - "/lib64"
        - "/usr/lib"
        - "/usr/lib64"
        - "/usr/libexec"
      globs: []

    - id: mac_policy_write
      title: "强制访问控制策略写入"
      severity: high
      match: write_only
      attck: ["T1562.001"]
      reason: "改写 SELinux / AppArmor 策略是关闭系统自身防护的直接手段"
      basis: "Neo23x0 auditd mac_policy key：-w /etc/selinux/、/etc/apparmor/、/etc/apparmor.d/"
      prefixes:
        - "/etc/selinux"
        - "/etc/apparmor"
        - "/etc/apparmor.d"
      globs: []

    - id: name_resolution_hijack
      title: "名称解析与信任根写入"
      severity: high
      match: write_only
      attck: ["T1565.001", "T1553.004"]
      reason: "写入 hosts/resolv.conf 可把流量导向攻击者；写入 CA 信任目录可让伪造证书被系统信任。读取二者是每次域名解析与 TLS 握手的常规行为"
      basis: "Neo23x0 auditd network_modifications key：-w /etc/hosts、-w /etc/resolv.conf；ATT&CK T1553.004 Install Root Certificate"
      prefixes:
        - "/etc/hosts"
        - "/etc/resolv.conf"
        - "/etc/ssl/certs"
        - "/etc/pki/ca-trust"
      globs: []

  # ==========================================================================
  # 运行时加载文件/目录前缀：命中判为 runtime（框架/系统正常运行所需，不算敏感越权）。
  # 说明：本段只影响报告分类可读性，不影响是否判为异常；上面 sensitive_groups
  # 的优先级更高，因此 /etc/passwd 这类"读 runtime、写敏感"的路径两边都出现是
  # 有意为之，不是冲突。
  # 条目来源：454 个真实 round 回放中实际出现且经确认属于运行时的路径。
  # ==========================================================================
  runtime_prefixes:
    # 动态链接与 C 运行时
    - "/lib"
    - "/lib64"
    - "/usr/lib"
    - "/usr/lib64"
    - "/usr/libexec"
    - "/usr/local/lib"
    - "/usr/local/lib64"
    - "/usr/local/libexec"
    - "/etc/ld.so.cache"
    - "/etc/ld.so.preload"
    - "/etc/ld.so.conf"
    # 可执行文件
    - "/usr/bin"
    - "/bin"
    - "/sbin"
    - "/usr/sbin"
    - "/usr/local/bin"
    - "/usr/local/sbin"
    # 只读共享数据（locale / 时区 / 加密策略 / bash 补全 / tcl 等）
    - "/usr/share"
    - "/usr/lib/locale"
    # 名称解析（NSS）
    - "/etc/nsswitch.conf"
    - "/etc/authselect"                    # RHEL 8+ 的 nsswitch.conf 真实位置
    - "/etc/passwd"
    - "/etc/group"
    - "/etc/hosts"
    - "/etc/host.conf"
    - "/etc/resolv.conf"
    - "/run/systemd"                       # 含 userdb 等 NSS 后端
    # 时区、TLS 信任根、加密策略
    - "/etc/localtime"
    - "/etc/ssl/certs"
    - "/etc/pki"
    - "/etc/crypto-policies"
    # Shell 启动与补全（bash 每次启动都会读，写入才敏感）
    - "/etc/profile"
    - "/etc/bashrc"
    - "/etc/bash_completion.d"
    - "/etc/shells"
    - "/etc/GREP_COLORS"
    - "/etc/debuginfod"
    # 主机与内核只读信息
    - "/etc/os-release"
    - "/etc/machine-id"
    - "/proc/"
    - "/sys/"
    - "/dev/null"
    - "/dev/zero"
    - "/dev/full"
    - "/dev/tty"
    - "/dev/pts"
    - "/dev/console"
    - "/dev/urandom"
    - "/dev/random"

  # ==========================================================================
  # openclaw 框架自身运行时：命中判为 runtime。
  # 现在整棵 /root/.openclaw 都归这里 —— 回放证明它下面的 28 个二级目录
  # （sandbox / sandboxes / extensions / skills / state / agents / …）全部是框架
  # 自身文件，逐个挖白名单既追不上版本迭代，又制造了 92% 的敏感误报。
  # 真正需要在这棵树里报警的凭据文件（.env、id_rsa、.git-credentials 等）由上面
  # override_runtime: true 的三个组穿透捞回，检测力没有损失。
  # ==========================================================================
  openclaw_runtime_prefixes:
    - "/usr/lib/node_modules/openclaw"
    - "/root/.openclaw"

  # openclaw 的运行时上下文文档（AGENT.md 等），无论落在哪个 workspace 目录都视为 runtime。
  openclaw_runtime_basenames:
    - "AGENT.md"
    - "AGENTS.md"
    - "SOUL.md"
    - "HEARTBEAT.md"
    - "TOOLS.md"
    - "IDENTITY.md"
    - "MEMORY.md"
    - "USER.md"
